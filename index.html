<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<title>Claire</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Gør siden til en app, når den lægges på hjemmeskærmen (iPhone: Del → Føj til hjemmeskærm) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Claire">
<!-- "default": iPhonen holder selv plads til klokken øverst, og siden fylder præcis resten af skærmen på alle modeller -->
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EDEDED">
<meta name="robots" content="noindex, nofollow">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<style>
  html, body { margin: 0; height: 100%; background: #EDEDED; overscroll-behavior: none; }
  body.setupmode { background: #0B0B0C; }
  body { font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #fff; -webkit-text-size-adjust: 100%; }
  /* Claire fylder hele skærmen; selve Claire tager højde for notch og hjem-streg (de sendes med i adressen) */
  /* Claire fylder hele skærmen fra top til bund.
     iPhone-fejl: i en hjemmeskærm-app starter siden bag klokken, men "100% højde" er skærmen MINUS klokkens højde –
     derfor kom der en stribe i bunden. Vi lægger klokkens højde (safe-area-inset-top) til; hvor siden ikke ligger bag
     klokken, er den 0, så det passer på alle modeller. JS (fitFrame) gør det samme og holder højden inden for skærmen. */
  #claire { position: fixed; top: 0; left: 0; width: 100%; height: 100%; border: 0; background: #EDEDED; }
  /* måler iPhonens sikre kanter */
  #probe { position: fixed; top: 0; left: 0; width: 0; height: 0; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); visibility: hidden; }
  /* Menuen i bunden tegnes HER (uden for Googles rammer), så den altid sidder helt nede – på alle iPhone-modeller */
  #nav { display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: #FFFFFF; border-top: 1px solid rgba(0,0,0,.08);
         padding: 5px 6px 0; box-sizing: border-box; align-items: flex-start; font: 600 11px/1.1 -apple-system, BlinkMacSystemFont, sans-serif; }
  #nav.on { display: flex; }
  /* Menuens hvide baggrund fortsætter under skærmkanten, så der aldrig kan opstå en stribe under den */
  #nav::after { content: ""; position: absolute; left: 0; right: 0; top: 100%; height: 200px; background: inherit; }
  #nav button { flex: 1 1 0; min-width: 0; height: 58px; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border: 0; background: none;
                padding: 0 2px; line-height: 1.2; color: #A1A1AA; font: inherit; -webkit-tap-highlight-color: transparent; }
  #nav button.on { color: #0B0B0C; }
  #nav svg { flex: none; display: block; width: 24px !important; height: 24px !important; min-width: 24px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  #nav button.on svg { stroke-width: 2.1; }
  #nav .dot { position: absolute; top: 4px; left: calc(50% + 8px); width: 8px; height: 8px; border-radius: 50%; border: 2px solid #fff; }
  #nav .dot.bp { background: #D97706; } #nav .dot.ba { background: #DC2626; }
  #nav.dark { background: #131316; border-top-color: rgba(255,255,255,.08); }
  #nav.dark button { color: #71717A; } #nav.dark button.on { color: #FAFAFA; } #nav.dark .dot { border-color: #131316; }
  /* Vises med det samme, mens Google starter Claire (ellers hvid skærm). Blokerer også scroll under indlæsning. */
  #boot { position: fixed; inset: 0; z-index: 20; background: #EDEDED; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 18px; touch-action: none; }
  #boot.on { display: flex; }
  #boot .bm { width: 64px; height: 64px; border-radius: 50%; background: #0B0B0C; color: #fff; display: grid; place-items: center; font: 700 28px/1 -apple-system, sans-serif; }
  #boot .sp { width: 26px; height: 26px; border-radius: 50%; border: 3px solid rgba(0,0,0,.12); border-top-color: #0B0B0C; animation: bootspin .8s linear infinite; }
  body.dark #boot { background: #0B0B0C; } body.dark #boot .bm { background: #FAFAFA; color: #0B0B0C; }
  body.dark #boot .sp { border-color: rgba(255,255,255,.15); border-top-color: #FAFAFA; } body.dark #boot .pct { color: #A1A1AA; }
  @keyframes bootspin { to { transform: rotate(360deg); } }
  #boot .pct { font: 600 11px/1 -apple-system, sans-serif; color: #71717A; letter-spacing: .04em; font-variant-numeric: tabular-nums; min-width: 4ch; text-align: center; }
  .setup { display: none; min-height: 100%; box-sizing: border-box; padding: calc(40px + env(safe-area-inset-top)) 24px 40px; max-width: 460px; margin: 0 auto; }
  .setup.on { display: block; }
  .mark { width: 64px; height: 64px; border-radius: 50%; background: #fff; color: #0B0B0C; display: grid; place-items: center; font: 700 30px/1 -apple-system, sans-serif; margin-bottom: 20px; }
  h1 { font-size: 28px; margin: 0 0 8px; letter-spacing: -.02em; }
  p { color: #A1A1AA; margin: 0 0 20px; }
  .setup input { width: 100%; box-sizing: border-box; font-size: 16px; padding: 14px 16px; border-radius: 14px; border: 1px solid #2A2A30; background: #131316; color: #fff; }
  .setup button { margin-top: 12px; width: 100%; font: 600 16px/1 -apple-system, sans-serif; padding: 15px; border-radius: 999px; border: 0; background: #fff; color: #0B0B0C; }
  .err { color: #F87171; margin-top: 12px; min-height: 20px; }
  .slow { display: none; z-index: 21; position: fixed; left: 16px; right: 16px; bottom: calc(24px + env(safe-area-inset-bottom)); text-align: center; color: #A1A1AA; font-size: 13px; }
  .slow a { color: #0B0B0C; font-weight: 600; }
</style>
</head>
<body>
<div id="probe"></div>

<!-- Første gang: indsæt Claires adresse (gemmes kun på denne telefon) -->
<div class="setup" id="setup">
  <div class="mark">C</div>
  <h1>Claire</h1>
  <p>Indsæt adressen til Claire én gang. Den slutter på <b>/exec</b> og står under Implementér → Administrer implementeringer i Apps Script.</p>
  <input id="url" type="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://script.google.com/macros/s/…/exec">
  <button onclick="saveUrl()">Gem og åbn Claire</button>
  <div class="err" id="err"></div>
</div>

<div id="boot" aria-label="Indlæser Claire"><div class="bm">C</div><div class="sp"></div><div class="pct" id="bootpct">0%</div></div>
<nav id="nav" aria-label="Menu"></nav>
<div class="slow" id="slow">Åbner Claire … Sker der ikke noget? <a id="direct" href="#">Åbn Claire direkte</a></div>

<script>
  // Valgfrit: skriv Claires /exec-adresse her, så slipper man for at indsætte den på telefonen.
  // Lad den stå tom, hvis GitHub-repoet er offentligt – så ligger adressen kun på din egen telefon.
  var CLAIRE_URL = '';

  var VALID = /^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/;
  function stored() { try { return localStorage.getItem('claire_url') || ''; } catch (e) { return ''; } }
  function inset(prop) { var v = parseInt(getComputedStyle(document.getElementById('probe'))[prop], 10); return isNaN(v) ? 0 : v; }

  function openClaire(url) {
    var src = url + '?app=1&st=' + inset('paddingTop') + '&sb=' + inset('paddingBottom');
    var f = document.createElement('iframe');
    f.id = 'claire'; f.title = 'Claire'; f.src = src;
    f.setAttribute('allow', 'clipboard-write');
    document.body.appendChild(f);
    document.getElementById('boot').classList.add('on');
    bootProg(5); BP.timer = setInterval(bootTick, 90);
    f.addEventListener('load', function () { bootProg(30); });
    setTimeout(hideBoot, 25000);   // sikkerhedsnet
    fitFrame(); setTimeout(fitFrame, 300); setTimeout(fitFrame, 1200);
    document.getElementById('direct').href = url;
    // Hvis Claire ikke dukker op (fx gammel Claire.gs uden app-tilladelse), vis et link efter 12 sek.
    var t = setTimeout(function () { document.getElementById('slow').style.display = 'block'; }, 12000);
    f.addEventListener('load', function () { clearTimeout(t); document.getElementById('slow').style.display = 'none'; });
  }
  var ICONS = {"overview": "<path d=\"M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z\"/>", "tracks": "<path d=\"M9 18V5l12-2v13\"/><circle cx=\"6\" cy=\"18\" r=\"3\"/><circle cx=\"18\" cy=\"16\" r=\"3\"/>", "economy": "<path d=\"M3 20h18\"/><rect x=\"5\" y=\"11\" width=\"3\" height=\"6\" rx=\"1\"/><rect x=\"10.5\" y=\"7\" width=\"3\" height=\"10\" rx=\"1\"/><rect x=\"16\" y=\"4\" width=\"3\" height=\"13\" rx=\"1\"/>", "radio": "<rect x=\"3\" y=\"8\" width=\"18\" height=\"12\" rx=\"2\"/><circle cx=\"8\" cy=\"14\" r=\"2.5\"/><path d=\"M14 12h4M14 16h4M7 8l9-5\"/>", "ai": "<path d=\"M12 3l1.8 4.6L18.5 9l-4.7 1.6L12 15l-1.8-4.4L5.5 9l4.7-1.4z\"/><path d=\"M19 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z\"/>", "inbox": "<path d=\"M3 13h5l2 3h4l2-3h5\"/><path d=\"M5 5h14l2 8v6a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-6z\"/>", "calendar": "<rect x=\"3\" y=\"5\" width=\"18\" height=\"16\" rx=\"2\"/><path d=\"M3 10h18M8 3v4M16 3v4\"/>", "more": "<circle cx=\"5\" cy=\"12\" r=\"1.6\"/><circle cx=\"12\" cy=\"12\" r=\"1.6\"/><circle cx=\"19\" cy=\"12\" r=\"1.6\"/>"};
  var NAV_H = 66;            // menuens højde uden hjem-stregen (ikon + tekst + luft)
  var navShown = false;

  // Hvor langt ned kan der ses? iPhone-fejl: i hjemmeskærm-appen er siden "klokkens højde" for kort.
  function bottomInset() {
    var b = inset('paddingBottom');
    // iPhones med hjem-streg (fra iPhone X til 17/18) er mindst 812 punkter høje
    if (!b && window.navigator.standalone && Math.max(screen.width, screen.height) >= 812) b = 34;
    return b;
  }
  function hideBoot() { document.getElementById('boot').classList.remove('on'); clearInterval(BP.timer); }
  // Procent: rigtige trin (Google-siden hentet → Claire startet → login → data) + langsom krybning imellem
  var BP = { v: 0, t: 0, timer: null };
  function bootProg(v) { BP.t = Math.max(BP.t, Math.min(100, v)); }
  function bootTick() {
    var cap = BP.t >= 100 ? 100 : Math.min(99, BP.t + 9);
    BP.v += Math.max(0.15, (cap - BP.v) * (BP.v < BP.t ? 0.18 : 0.02));
    if (BP.v > cap) BP.v = cap;
    var el = document.getElementById('bootpct'); if (el) el.textContent = Math.floor(BP.v) + '%';
  }
  // Standard app-opbygning: menuen sidder fast i bunden af skærmen (bottom: 0) og Claire fylder resten ovenover.
  // Ingen gætteri på skærmhøjder – det var det, der gav de skårne menuer på nogle iPhones.
  function layout() {
    var f = document.getElementById('claire'); if (!f) return;
    var nav = document.getElementById('nav');
    var nb = navShown ? NAV_H + bottomInset() : 0;
    nav.style.height = nb + 'px'; nav.style.paddingBottom = bottomInset() + 'px';
    f.style.height = Math.max(200, window.innerHeight - nb) + 'px';
  }
  // Følg Claires tema: farven bag klokken øverst (theme-color), baggrund og menu
  function applyTheme(t) {
    var dark = t === 'dark', bg = dark ? '#0B0B0C' : '#EDEDED';
    var tc = document.querySelector('meta[name="theme-color"]'); if (tc) tc.setAttribute('content', bg);
    document.documentElement.style.background = bg; document.body.style.background = bg;
    var f = document.getElementById('claire'); if (f) f.style.background = bg;
    try { localStorage.setItem('claire_theme', dark ? 'dark' : 'light'); } catch (e) {}
    document.body.classList.toggle('dark', dark);
  }
  function renderNav(m) {
    if (m.theme === 'dark' || m.theme === 'light') applyTheme(m.theme);
    var nav = document.getElementById('nav');
    var items = (m.items || []).slice(0, 4);
    navShown = items.length > 0;
    nav.className = navShown ? ('on' + (m.theme === 'dark' ? ' dark' : '')) : '';
    nav.innerHTML = '';
    if (navShown) items.concat([{ k: '__more', label: 'Mere' }]).forEach(function (it) {
      if (!/^[a-z_]{2,20}$/.test(it.k || '')) return;
      var b = document.createElement('button');
      if (it.k === m.active) b.className = 'on';
      b.innerHTML = '<svg viewBox="0 0 24 24">' + (ICONS[it.k === '__more' ? 'more' : it.k] || ICONS.more) + '</svg>';
      if (it.dot === 'bp' || it.dot === 'ba') { var d = document.createElement('i'); d.className = 'dot ' + it.dot; b.appendChild(d); }
      var sp = document.createElement('span'); sp.textContent = String(it.label || '').slice(0, 14); b.appendChild(sp);
      b.addEventListener('click', function () { if (lastFrame) lastFrame.win.postMessage({ claire: 'go', k: it.k }, lastFrame.origin); });
      nav.appendChild(b);
    });
    layout();
  }

  // Fyld hele skærmen, også bag hjem-stregen
  function fitFrame() { layout(); }


  // "Husk denne enhed": iPhonen sletter Claires eget lager, når appen lukkes. Startsiden gemmer derfor nøglen
  // og giver den kun til Claire (Apps Script-sider på *-script.googleusercontent.com).
  // Kanterne (notch/hjem-streg) måles igen, når Claire spørger og ved drejning – ved opstart kan de være 0
  var lastFrame = null;
  function sendInsets() {
    fitFrame();
    if (lastFrame) try { lastFrame.win.postMessage({ claire: 'insets', st: inset('paddingTop'), sb: 0 }, lastFrame.origin); } catch (e) {}
  }
  window.addEventListener('resize', sendInsets);
  window.addEventListener('orientationchange', function () { setTimeout(sendInsets, 300); });
  window.addEventListener('pageshow', function () { setTimeout(sendInsets, 100); });
  var CLAIRE_FRAME = /^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/;
  window.addEventListener('message', function (ev) {
    if (!CLAIRE_FRAME.test(ev.origin)) return;
    var f = document.getElementById('claire'); if (!f) return;
    // Kun Claire inde i vores egen ramme (ikke en anden Apps Script-side) må få nøglen
    var w = ev.source, inside = false;
    try { for (var i = 0; i < 5 && w; i++) { if (w === f.contentWindow) { inside = true; break; } if (w === w.parent) break; w = w.parent; } } catch (e) {}
    if (!inside) return;
    var m = ev.data || {};
    if (m.claire === 'progress') { bootProg(Number(m.v) || 0); return; }
    if (m.claire === 'getKey') {
      bootProg(50);
      var k = ''; try { k = localStorage.getItem('claire_dev') || ''; } catch (e) {}
      // nav: true = startsiden tegner menuen. sb = 0, fordi menuen her selv tager højde for hjem-stregen.
      ev.source.postMessage({ claire: 'key', key: k, nav: true, st: inset('paddingTop'), sb: 0 }, ev.origin);
      lastFrame = { win: ev.source, origin: ev.origin };
    } else if (m.claire === 'ready') {
      lastFrame = { win: ev.source, origin: ev.origin };
      hideBoot(); document.getElementById('slow').style.display = 'none';
    } else if (m.claire === 'nav') {
      lastFrame = { win: ev.source, origin: ev.origin };
      renderNav(m);
    } else if (m.claire === 'setKey') {
      try {
        if (/^[a-f0-9]{64}$/.test(m.key || '')) localStorage.setItem('claire_dev', m.key);
        else localStorage.removeItem('claire_dev');
      } catch (e) {}
    }
  });

  function saveUrl() {
    var u = document.getElementById('url').value.trim().replace(/\?.*$/, '');
    if (!VALID.test(u)) { document.getElementById('err').textContent = 'Det ligner ikke en Claire-adresse. Den skal starte med https://script.google.com/macros/s/ og slutte på /exec.'; return; }
    try { localStorage.setItem('claire_url', u); } catch (e) {}
    document.getElementById('setup').classList.remove('on'); document.body.classList.remove('setupmode');
    openClaire(u);
  }

  // Sidst brugte tema med det samme (så indlæsningen ikke blinker lys, når du bruger mørkt tema)
  try { var savedTheme = localStorage.getItem('claire_theme'); if (savedTheme === 'dark') applyTheme('dark'); } catch (e) {}
  var url = VALID.test(CLAIRE_URL) ? CLAIRE_URL : stored();
  if (VALID.test(url)) openClaire(url); else { document.getElementById('setup').classList.add('on'); document.body.classList.add('setupmode'); }
</script>
</body>
</html>
